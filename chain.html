<!DOCTYPE html>
<html>
<head>
    <title>pinpad2</title>
    <link rel="stylesheet" type="text/css" href="chain.css">
    <style>
      .circle:hover{
        cursor: pointer;
      }
    </style>
</head>
<body>

<div class="container">
  <div class="door" onclick="OpenDoor()">
    <div class="door-panel">
      <div class="handle">
        <div class="circle" onclick="Click(event)"></div>
      </div>
    </div>
    <div class="chain-wrap">
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
    </div>
    <div class="chain-wrap chain-wrap-cross" >
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
      <span class="chain-link"></span>
    </div>
  </div>
</div>  
<script>
    let count = 0;
    let N = Math.floor(Math.random() * 20) + 20;
    let isUnlocked = false;
    let isOpened = false;
    const NEXT_PAGE = "/key.html";
    console.log(N);
    function Click(event){
        event.stopPropagation(); // 손잡이 클릭이 문 클릭으로 전달되지 않게
        if(isUnlocked){
            return;
        }

        count++;
        console.log(count);
        if(count >= N){
            sessionStorage.setItem('chainUnlocked', '1');
            Unlock();
        }
    }

    function Unlock(){
        isUnlocked = true;
        document.querySelector('.circle').classList.add('disabled');
        document.querySelectorAll('.chain-wrap').forEach(function(chain) {
            chain.classList.add('hidden');
        });
        document.querySelector('.door').classList.add('unlocked');
    }

    // 한 번 풀린 체인은 다시 들어와도 풀린 상태 유지
    if(sessionStorage.getItem('chainUnlocked') === '1'){
        Unlock();
    }

    function OpenDoor(){
        if(!isUnlocked || isOpened){
            return;
        }
        window.location.href = NEXT_PAGE;
    }
</script>
</body>
</html>
