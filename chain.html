<!DOCTYPE html>
<html>
<head>
    <title>pinpad2</title>
    <link rel="stylesheet" type="text/css" href="chain.css">
    <style>
      .circle:hover{
        cursor: pointer;
      }
    </style>
</head>
<body>
<img src="/image/KakaoTalk_20261109_183025034_01.png" alt="" id="back_two">
<img src="/image/KakaoTalk_20261109_183025034_02.png" alt="" id="back">
<div class="container">
  <div class="door" onclick="OpenDoor()">
    <div class="door-panel">
      <div class="handle">
        <div class="circle"></div>
      </div>
    </div>
  </div>
         <img src="/image/light.png" alt="" id="light">
  
        <img src="/image/left_button.png" alt="" id="left_map">
    <img src="/image/black_screen.png" alt="" id="fade" />
</div>
<script>
    let count = 0;
    let N = Math.floor(Math.random() * 20) + 20;
    let isUnlocked = false;
    let isOpened = false;
    const NEXT_PAGE = "/key.html";
    console.log(N);
    const back = document.getElementById("back")
    function Click(){
        if(isUnlocked){
            return;
        }

        count++;
        console.log(count);
        if(count >= N){
            sessionStorage.setItem('chainUnlocked', '1');
            Unlock();
        }
    }

    function Unlock(){
        isUnlocked = true;
        document.querySelector('.circle').classList.add('disabled');
        back.style.opacity = 0; // 배경 사슬 이미지 숨김
        document.querySelector('.door').classList.add('unlocked');
    }

    // 한 번 풀린 체인은 다시 들어와도 풀린 상태 유지
    if(sessionStorage.getItem('chainUnlocked') === '1'){
        Unlock();
    }

    function OpenDoor(){
        // 잠겨 있으면 문 어디를 눌러도 count 증가
        if(!isUnlocked){
            Click();
            return;
        }
        if(isOpened){
            return;
        }
        const urlscan = window.location.href;
        if(urlscan.includes("unlocked=1") && urlscan.includes("key=1")){
            window.location.href = NEXT_PAGE + "?unlocked=1&key=1";
        }
        else if(urlscan.includes("unlocked=1")){
            window.location.href = NEXT_PAGE + "?unlocked=1";
        }
        else if(urlscan.includes("key=1")){
            window.location.href = NEXT_PAGE + "?key=1";
        }
        else{
            window.location.href = NEXT_PAGE;
        }
    }

    const left_map = document.getElementById('left_map')

const black = document.getElementById("fade")

const urlscan = window.location.href;

let key = false;

let unlocked = false;

if(urlscan.includes("unlocked=1")){
  unlocked = true;
}

if(urlscan.includes("key=1")){
  key = true;
}

left_map.addEventListener('click', () => {
  setTimeout(() => {
    black.classList.add("fade-animation-in");
  }, 200);
    setTimeout(() => {
       if(unlocked==true&&key==true){
            window.location.href = "/stages/road/road.html?unlocked=1&key=1"
        }
        else if(unlocked==true&&key==false){
            window.location.href = "/stages/road/road.html?unlocked=1"
        }
        else if(unlocked==false&&key==true){
            window.location.href = "/stages/road/road.html?key=1"
        }
        else if(unlocked==false&&key==false){
            window.location.href = "/stages/road/road.html"
        }
    }, 600);
})

  const follower = document.getElementById('light');

    document.addEventListener('mousemove', (e) => {
      follower.style.left = `${e.pageX-220}px`;
      follower.style.top = `${e.pageY-220}px`;
    });

</script>
</body>
</html>
