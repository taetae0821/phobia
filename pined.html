<!DOCTYPE html>
<html>
<head>
    <title>pinpad</title>
    <style type="text/css">
        body {
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .door {
            border: 10px solid black;
            width: 100px;
            height: 200px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .handle {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lock {
            width: 20px;
            height: 20px;
            background-color: black;
            cursor: pointer;
        }

        .circle {
            width: 35px;
            height: 35px;
            background-color: blue;
            border-radius: 50%;
        }

        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(6px);
            background: rgba(255, 255, 255, 0.05);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .blur-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .panel {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 340px;
            background: white;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            box-sizing: border-box;
            padding: 24px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;

            transform: translate(-50%, 150%);
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .panel.active {
            transform: translate(-50%, -50%);
            opacity: 1;
        }

        #numInput {
            color: black;
            background: white;
            text-align: center;
            margin: 0 0 12px;
            font-size: 2.2em;
            display: block;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            border: 2px solid black;
        }

        #keypad {
            width: 100%;
        }

        .keypad button {
            margin: 1%;
            width: 31%;
            height: 60px;
            background: #eee;
            border: 2px solid black;
            border-radius: 10px;
            font-size: 1.8em;
        }

        .keypad button.delete,
        .keypad button.submit {
            background: black;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
  <div class="door">
    <div class="handle">
      <div class="lock" onclick="openPanel()"></div>
      <div class="circle"></div>
    </div>
  </div>
</div>

<div class="blur-overlay" id="blurOverlay" onclick="closePanel()"></div>

<div class="panel" id="panel">
  <h2 style="margin: 0;">비밀번호를 입력하세요</h2>
  <input type="text" class="keypad" id="numInput" disabled="disabled" />
  <div id="keypad"></div>
</div>

<script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
<script type="text/javascript" src="jquery.keypad.js"></script>
<script>
function openPanel() {
    document.getElementById('panel').classList.add('active');
    document.getElementById('blurOverlay').classList.add('active');
}

function closePanel() {
    document.getElementById('panel').classList.remove('active');
    document.getElementById('blurOverlay').classList.remove('active');
    $('#numInput').val('').css({ color: 'black', 'border-color': 'black' });
}
</script>
<script type="text/javascript">
    $(document).ready(function() {
        $('#keypad').keypad();

        $('#numInput').on('change', function() {
            var value = $(this).val();

            if (value.length < 4) {
                $(this).css({ color: 'black', 'border-color': 'black' });
                return;
            }

            if (value === "0713") {
                $(this).css({ color: 'green', 'border-color': 'green' });
                setTimeout(closePanel, 400);
            } else {
                $(this).css({ color: 'red', 'border-color': 'red' });
            }
        });
    });

    (function($) {
        (function(pluginName) {
            var defaults = {
                inputField: 'input.keypad',
                buttonTemplate: '<button></button>',
                submitButtonText: '전체',
                deleteButtonText: '←',
                submitButtonClass: 'submit',
                deleteButtonClass: 'delete'
            };
            $.fn[pluginName] = function(options) {
                options = $.extend(true, {}, defaults, options);

                return this.each(function() {
                    var elem = this,
                        $elem = $(elem),
                        $input = jQuery.type(options.inputField) == 'string' ? $(options.inputField) : options.inputField,
                        $form = $input.parents('form').length ? $($input.parents('form')[0]) : $elem;

                    var numbers = Array.apply(null, Array(9)).map(function (_, i) {
                        return $(options.buttonTemplate).html(i+1).addClass('number');
                    });
                    numbers.push($(options.buttonTemplate).html(options.submitButtonText).addClass(options.submitButtonClass));
                    numbers.push($(options.buttonTemplate).html("0").addClass('number'));
                    numbers.push($(options.buttonTemplate).html(options.deleteButtonText).addClass(options.deleteButtonClass));

                    $elem.html(numbers).addClass('keypad');

                    $elem.find('.number').click(function(e) {
                        $input.val($input.val() + $(e.target).text());
                        $input.trigger('change');
                    });
                    $elem.find('.' + options.deleteButtonClass).click(function(e) {
                        $input.val($input.val().slice(0, -1));
                        $input.trigger('change');
                    });
                    $elem.find('.' + options.submitButtonClass).click(function(e) {
                        $("#numInput").val("");
                    });
                });
            };
            $.fn[pluginName].defaults = defaults;
        })('keypad');
    })(jQuery);
</script>
</body>
</html>
