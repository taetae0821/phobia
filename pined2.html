<!DOCTYPE html>
<html>
<head>
    <title>pinpad2</title>
    <link rel="stylesheet" type="text/css" href="pined2.css">
</head>
<body>

  <img src="/image/KakaoTalk_20261109_203228529_02.png" id="back_three">
  <img src="/image/KakaoTalk_20261109_203228529_01.png" id="back_two">
  <img src="/image/KakaoTalk_20261109_203228529.png" id="back">

<div class="container">
  <div class="door">
    <div class="handle">
      <div class="image" onclick="Having()"></div>
      <div class="lock" onclick="openPanel()"></div>
      <div class="circle"></div>
    </div>
  </div>
</div>

<div class="blur-overlay" id="blurOverlay" onclick="closePanel()"></div>

<div class="panel" id="panel">
  <h2 style="margin: 0;">비밀번호를 입력하세요</h2>
  <input type="text" class="keypad" id="numInput" disabled="disabled" />
  <div id="keypad"></div>
</div>
 <img src="/image/light.png" alt="" id="light">

    <img src="/image/left_button.png" alt="" id="left_map">

<video id="endingCredit" src="/endingCredit.mp4" playsinline preload="auto"></video>

<script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
<script type="text/javascript" src="jquery.keypad.js"></script>
<script type="text/javascript" src="pined2.js"></script>
</body>
</html>
